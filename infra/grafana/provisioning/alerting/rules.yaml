# 경보 규칙. 근거: docs/prd/05-grafana-dashboard.md '경보'
# 평가 쿼리는 데이터 소스(grafana_reader)로 실행한다. 외부 알림은 보내지 않고 상태만 화면에서 확인한다.
# 각 쿼리는 숫자 1행을 반환하고, 표현식 C가 임계값과 비교한다. 임계값은 실측 전 초기값이다.
apiVersion: 1

groups:
  # 진행 공백은 Driver 감시(90초)보다 먼저 떠야 하므로 10초마다 평가한다.
  - orgId: 1
    name: spark-progress
    folder: log-etlm
    interval: 10s
    rules:
      - uid: spark-progress-gap
        title: Spark 진행 공백
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 생성기 입력이 있는데 최근 30초 동안 입력을 처리한 Spark 진행 행이 없다.
          description: >-
            Driver 프로세스 멈춤이나 처리량 0 상태일 수 있다. ops 지표 쓰기 실패로도 공백이 생기므로
            `docker compose logs spark`에서 쿼리 상태와 지표 쓰기 경고를 확인한다.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              format: 1
              rawSql: |-
                SELECT toUInt8(
                  (SELECT sum(acked) FROM ops.producer_stats
                   WHERE interval_start >= now64(3) - INTERVAL 30 SECOND) > 0
                  AND (SELECT count() FROM ops.spark_query_progress
                       WHERE trigger_at >= now64(3) - INTERVAL 30 SECOND AND num_input_rows > 0) = 0
                ) AS stalled
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

  - orgId: 1
    name: pipeline-failures
    folder: log-etlm
    interval: 1m
    rules:
      - uid: spark-restart
        title: Spark 재시작
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 최근 15분 동안 Spark 쿼리가 재시작했다(같은 query_id의 run_id 2개 이상).
          description: >-
            Compose는 횟수 상한 없이 재시작하므로 지속 실패는 무한 반복된다.
            `docker compose ps spark`의 재시작 횟수와 `docker compose logs spark`의 종료 원인을 확인한다.
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              format: 1
              rawSql: |-
                SELECT max(c) AS runs FROM (
                  SELECT query_id, uniqExact(run_id) AS c FROM ops.spark_query_progress
                  WHERE trigger_at >= now64(3) - INTERVAL 15 MINUTE
                  GROUP BY query_id
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [1]}

      - uid: spark-batch-failure
        title: Spark 배치 실패
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 최근 5분 동안 실패한 foreachBatch 시도가 있다.
          description: 파이프라인 운영 대시보드의 '실패 시도(실패 단계별)' 표에서 failed_stage를 확인한다.
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              format: 1
              rawSql: |-
                SELECT count() AS failed FROM ops.spark_batch_attempts
                WHERE callback_started_at >= now64(3) - INTERVAL 5 MINUTE AND status != 'succeeded'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: clickhouse-insert-failure
        title: ClickHouse INSERT 실패
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 최근 5분 동안 spark_writer의 실패한 쿼리가 있다(query_log flush로 최대 7.5초 늦게 반영).
          description: 권한·인증 오류는 tables가 빈 ExceptionBeforeStart로 남으므로 user·exception_code로 거른다.
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              format: 1
              rawSql: |-
                SELECT count() AS failed FROM system.query_log
                WHERE event_date >= toDate(now() - INTERVAL 5 MINUTE)
                  AND event_time >= now() - INTERVAL 5 MINUTE
                  AND user = 'spark_writer' AND exception_code != 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: id-conflict-1h
        title: ID 충돌(1시간)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 최근 1시간에 같은 event_id가 서로 다른 event_timestamp로 들어왔다.
          description: >-
            FINAL로도 합쳐지지 않아 해당 구간 주문 수·매출이 부풀 수 있다.
            docs/prd/04-clickhouse-storage.md '이벤트 식별과 테이블 기준'의 충돌 정책을 따른다.
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              format: 1
              rawSql: |-
                SELECT count() AS conflicts FROM (
                  SELECT cityHash64(event_id) AS h FROM gold.order_event_latency
                  WHERE event_timestamp >= now() - INTERVAL 1 HOUR
                  GROUP BY h HAVING min(event_timestamp) != max(event_timestamp)
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

# 전체 보관 구간 충돌 점검은 24시간 분량(약 4억 행)에서 메모리 약 13GB가 필요해 v1에서 뺐다.
# 이미 만들어진 Grafana DB에서도 지우도록 남겨 둔다. 근거: docs/prd/05-grafana-dashboard.md '경보'
deleteRules:
  - orgId: 1
    uid: id-conflict-full
