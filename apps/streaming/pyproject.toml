[project]
name = "streaming"
version = "0.1.0"
description = "Kafka 주문 로그 검증·분류·평탄화 Spark Structured Streaming 앱"
# 실행 환경은 Dockerfile의 공식 Spark 이미지(Python 3.10)다. 버전은 Dockerfile 설치 버전과 맞춘다.
requires-python = ">=3.10"
# log_generator.pools는 패키지 의존성이 아니라 Compose PYTHONPATH로 읽는다.
dependencies = [
    "pyspark==4.2.1",
    "jsonschema==4.26.0",
    "jsonschema-rs==0.61.2",
    "rfc3339-validator==0.1.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
