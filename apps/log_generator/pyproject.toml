[project]
name = "log-generator"
version = "0.1.0"
description = "주문 완료 이벤트 합성 로그 생성기"
requires-python = ">=3.12,<3.13"
dependencies = ["python-dotenv>=1.2,<2"]

[project.scripts]
log-generator = "log_generator.main:main"

[dependency-groups]
# 테스트에서 contracts/ JSON Schema 계약 검증에만 사용한다.
dev = ["jsonschema>=4.23"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
