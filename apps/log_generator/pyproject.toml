[project]
name = "log-generator"
version = "0.1.0"
description = "주문 완료 이벤트 합성 로그 생성기"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka==2.16.1",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
log-generator = "log_generator.main:main"

[dependency-groups]
# jsonschema: contracts/ JSON Schema 계약 검증, pytest: 테스트 실행기(unittest 기반 테스트도 실행한다).
dev = [
    "jsonschema>=4.23",
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
