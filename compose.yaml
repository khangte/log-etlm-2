# WSL 호스트와 Compose 내부 서비스에 서로 다른 접속 주소를 알린다.
services:
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:?KAFKA_HOST_PORT is required}:9092"
    environment:
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_HOST_PORT:?KAFKA_HOST_PORT is required},INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 단일 브로커에서 내부 토픽도 생성할 수 있도록 복제 계수를 맞춘다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # 이미지에서 appuser 소유로 준비된 데이터 경로. /tmp 하위를 마운트하면 root 소유 볼륨이라 쓰기가 거부된다.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:19092, --list]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:?KAFKA_TOPIC is required}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:?KAFKA_DLQ_TOPIC is required}
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    # 토픽 생성 설정은 스크립트 한 곳에서 관리한다. 기존 토픽은 변경하지 않는다.
    entrypoint: [/bin/bash, /scripts/init-topics.sh]
    volumes:
      - ./infra/kafka/init-topics.sh:/scripts/init-topics.sh:ro
    mem_limit: 512m
    restart: 'no'

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    # 파이프라인 운영·측정 중에는 띄우지 않는다. 필요할 때만 `--profile tools`로 실행한다.
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_UI_HOST_PORT:?KAFKA_UI_HOST_PORT is required}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      # 설정은 Compose 환경변수로만 관리한다. UI에서 편집·영속화하지 않는다.
      DYNAMIC_CONFIG_ENABLED: 'false'
      JAVA_OPTS: -Xmx512m
    cpus: 1
    mem_limit: 1g

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.38.9
    # HTTP 인터페이스는 호스트 생성기의 지표 INSERT와 수동 점검용이다. 루프백에만 게시한다.
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:?CLICKHOUSE_HTTP_HOST_PORT is required}:8123"
    environment:
      # 관리자 계정. 이 설정을 쓰면 이미지가 인증 없는 default 사용자를 만들지 않는다.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER is required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    cpus: 2
    mem_limit: 4g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse-init:
    image: clickhouse/clickhouse-server:26.8.38.9
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER is required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_SPARK_PASSWORD: ${CLICKHOUSE_SPARK_PASSWORD:?CLICKHOUSE_SPARK_PASSWORD is required}
      CLICKHOUSE_GENERATOR_PASSWORD: ${CLICKHOUSE_GENERATOR_PASSWORD:?CLICKHOUSE_GENERATOR_PASSWORD is required}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?CLICKHOUSE_GRAFANA_PASSWORD is required}
    # 계정·스키마·권한 적용은 스크립트 한 곳에서 관리한다. 모든 문이 반복 실행에 안전하다.
    entrypoint: [/bin/bash, /scripts/init.sh]
    volumes:
      - ./infra/clickhouse/init.sh:/scripts/init.sh:ro
      - ./infra/clickhouse/schema.sql:/scripts/schema.sql:ro
    mem_limit: 512m
    restart: 'no'

  spark:
    build: ./apps/streaming
    # 실행 중인 애플리케이션의 내장 Spark UI를 로컬에서 확인한다.
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:?SPARK_KAFKA_BOOTSTRAP_SERVERS is required}
      KAFKA_TOPIC: ${KAFKA_TOPIC:?KAFKA_TOPIC is required}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:?KAFKA_DLQ_TOPIC is required}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:?SPARK_STARTING_OFFSETS is required}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:?SPARK_MAX_OFFSETS_PER_TRIGGER is required}
      SPARK_TRIGGER_INTERVAL: ${SPARK_TRIGGER_INTERVAL:?SPARK_TRIGGER_INTERVAL is required}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:?SPARK_SHUFFLE_PARTITIONS is required}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR:?SPARK_CHECKPOINT_DIR is required}
      SPARK_JDBC_BATCH_SIZE: ${SPARK_JDBC_BATCH_SIZE:?SPARK_JDBC_BATCH_SIZE is required}
      SPARK_JDBC_NUM_PARTITIONS: ${SPARK_JDBC_NUM_PARTITIONS:?SPARK_JDBC_NUM_PARTITIONS is required}
      SPARK_CLICKHOUSE_JDBC_URL: ${SPARK_CLICKHOUSE_JDBC_URL:?SPARK_CLICKHOUSE_JDBC_URL is required}
      SPARK_CLICKHOUSE_HTTP_URL: ${SPARK_CLICKHOUSE_HTTP_URL:?SPARK_CLICKHOUSE_HTTP_URL is required}
      CLICKHOUSE_SPARK_PASSWORD: ${CLICKHOUSE_SPARK_PASSWORD:?CLICKHOUSE_SPARK_PASSWORD is required}
      # 기존 로컬 .env에 없어도 기동되도록 Compose 기본값 true를 둔다. 계측 오버헤드 대조군에서만 false로 바꾼다.
      SPARK_LATENCY_METRICS_ENABLED: ${SPARK_LATENCY_METRICS_ENABLED:-true}
      # 앱·생성기 풀(의미 검증 기준)·PySpark를 import 경로에 둔다. pytest도 같은 경로를 쓴다.
      PYTHONPATH: /opt/app/apps/streaming/src:/opt/app/apps/log_generator/src:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip
      # 코드가 읽기 전용 마운트라 바이트코드 캐시를 쓰지 않는다.
      PYTHONDONTWRITEBYTECODE: '1'
    # master·driver 메모리는 JVM 기동 전에 정해야 하므로 spark-submit 인자로 넘긴다.
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - ${SPARK_MASTER:?SPARK_MASTER is required}
      - --driver-memory
      - ${SPARK_DRIVER_MEMORY:?SPARK_DRIVER_MEMORY is required}
      - /opt/app/apps/streaming/src/streaming/main.py
    # 저장소와 같은 상대 구조(/opt/app)로 마운트해 transforms.py가 contracts/를 찾는다.
    volumes:
      - ./apps/streaming:/opt/app/apps/streaming:ro
      - ./apps/log_generator/src:/opt/app/apps/log_generator/src:ro
      - ./contracts:/opt/app/contracts:ro
      - spark-checkpoints:/opt/spark/checkpoints
    cpus: 3
    mem_limit: 3g

volumes:
  kafka-data:
  spark-checkpoints:
  clickhouse-data:
